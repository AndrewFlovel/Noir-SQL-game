services:
  query-noir:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: query_noir
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/sql-wasm.wasm || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
